
name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Check environment
        run: |
          java -version
          python --version
          sdkmanager --version

      - name: Install Gradle
        run: |
          curl -L --fail --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          "$RUNNER_TEMP/gradle-8.11.1/bin/gradle" --version

      - name: Build Debug APK
        shell: bash
        run: |
          set +e

          "$RUNNER_TEMP/gradle-8.11.1/bin/gradle" \
            assembleDebug \
            --stacktrace \
            --info \
            --no-daemon 2>&1 | tee build-log.txt

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "Resultado da compilação: $BUILD_STATUS"

          exit $BUILD_STATUS

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK
        if: success()
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bot-musica-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
