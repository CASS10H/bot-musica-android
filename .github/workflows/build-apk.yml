
name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Baixar o projeto
      - name: Checkout
        uses: actions/checkout@v7

      # Configurar Java
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Configurar Python
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Instalar Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Verificar ambiente
      - name: Check environment
        run: |
          java -version
          python --version
          sdkmanager --version

      # Instalar Gradle 8.11.1
      - name: Install Gradle
        run: |
          curl -L --fail --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          "$RUNNER_TEMP/gradle-8.11.1/bin/gradle" --version

      # Compilar APK
      - name: Build Debug APK
        run: |
          "$RUNNER_TEMP/gradle-8.11.1/bin/gradle" \
            assembleDebug \
            --stacktrace \
            --no-daemon

      # Verificar APK
      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # Enviar APK como artefato
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: bot-musica-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
