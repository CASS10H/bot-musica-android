<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#fe2c55;--c2:#25f4ee;--k:1;--v:1;--glass:.58;
  --f:"Sora","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:var(--f);color:#f4f5f8}
body.prev{background:#15161b!important}
#stage{position:fixed;inset:0;display:flex;padding:36px;pointer-events:none}
#stage.se{align-items:flex-start;justify-content:flex-start}#stage.sd{align-items:flex-start;justify-content:flex-end}
#stage.ie{align-items:flex-end;justify-content:flex-start}#stage.id{align-items:flex-end;justify-content:flex-end}
#stage.c{align-items:center;justify-content:center}
#box{transform:scale(var(--k));will-change:transform,opacity;opacity:0;width:max-content}
.se #box,.ie #box{transform-origin:left top}.sd #box,.id #box{transform-origin:right top}
.ie #box{transform-origin:left bottom}.id #box{transform-origin:right bottom}.c #box{transform-origin:center}
/* vidro */
.glass{position:relative;border-radius:22px;background:linear-gradient(135deg,rgba(30,32,42,var(--glass)),rgba(12,13,18,calc(var(--glass) + .12)));
  border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 40px -14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);overflow:hidden;isolation:isolate}
.glow{position:absolute;inset:-30%;z-index:-1;background:center/cover;filter:blur(38px) saturate(1.6);opacity:.5;transform:translateZ(0);animation:breathe calc(7s/var(--v)) ease-in-out infinite alternate}
@keyframes breathe{to{opacity:.7}}
.cov{position:relative;flex:none;border-radius:14px;overflow:hidden;background:#242632;box-shadow:0 8px 22px -6px rgba(0,0,0,.7)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.ttl{font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;line-height:1.25}
.ttl span{display:inline-block}.ttl.mq span{animation:mq calc(var(--t)*1s/var(--v)) ease-in-out 1.2s infinite alternate}
@keyframes mq{to{transform:translateX(calc(var(--d)*-1px))}}
.sub{opacity:.68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 10px;border-radius:99px;font-size:12.5px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c2);flex:none}
.chip b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px;flex:none}
.eq i{width:3.5px;height:100%;border-radius:2px;background:linear-gradient(var(--c2),var(--c1));transform-origin:bottom;transform:scaleY(.3);animation:eq calc(.9s/var(--v)) ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s;animation-duration:calc(.7s/var(--v))}.eq i:nth-child(3){animation-delay:-.55s;animation-duration:calc(1.1s/var(--v))}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{to{transform:scaleY(1)}}
.paused .eq i{animation-play-state:paused;transform:scaleY(.25)}
/* agora tocando */
.np{display:flex;gap:18px;align-items:center;padding:16px 22px 16px 16px;width:600px}
.np .cov{width:120px;height:120px}
.np .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.np .r1{display:flex;gap:12px;align-items:center}.np .ttl{font-size:26px;flex:1;min-width:0}
.np .sub{font-size:16px}.np .chip{align-self:flex-start;margin-top:3px}
.bw{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.track{position:relative;flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.14)}
.clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.fill,.head{position:absolute;inset:0;transform:translateX(-100%)}
.fill{background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:inherit}
.head:after{content:"";position:absolute;right:0;top:50%;width:11px;height:11px;margin:-5.5px -5.5px 0 0;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--c2),0 0 3px rgba(0,0,0,.5)}
.s-compacto .np{width:440px;padding:10px 16px 10px 10px;gap:12px;border-radius:99px}.s-compacto .np .cov{width:64px;height:64px;border-radius:50%}
.s-compacto .np .ttl{font-size:20px}.s-compacto .np .sub{font-size:14px}.s-compacto .np .chip{display:none}
.s-minimo .glass{background:none;border:0;box-shadow:none}.s-minimo .glow{display:none}.s-minimo .np{padding:0}
.s-minimo .ttl,.s-minimo .sub{text-shadow:0 2px 10px rgba(0,0,0,.85)}
/* listas */
.lst{width:430px;padding:16px 14px 12px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 8px 12px;font-weight:600;font-size:15px}
.hd small{opacity:.6;font-weight:400;font-size:13px}
.rows{position:relative;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:15px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06);will-change:transform,opacity}
.row .cov{width:46px;height:46px;border-radius:10px}
.row .tx{flex:1;min-width:0}.row .ttl{font-size:15px;font-weight:600;text-overflow:ellipsis}.row .sub{font-size:12.5px}
.row .n{width:20px;text-align:center;font-weight:700;font-size:15px;opacity:.55;flex:none}
.row .chip{font-size:11.5px;max-width:130px;padding:2px 8px}.row .tm{font-size:12.5px;opacity:.6;font-variant-numeric:tabular-nums}
.row.next{padding:11px 14px 11px 11px;background:linear-gradient(120deg,color-mix(in srgb,var(--c1) 24%,transparent),color-mix(in srgb,var(--c2) 14%,transparent));border-color:color-mix(in srgb,var(--c2) 45%,transparent)}
.row.next .cov{width:60px;height:60px}.row.next .ttl{font-size:17px;font-weight:700}.row.next .n{opacity:1;color:var(--c2)}
.more{text-align:center;font-size:12.5px;opacity:.55;padding:8px 0 0}
.s-compacto .row .cov,.s-compacto .row.next .cov{width:34px;height:34px}.s-compacto .row .sub{display:none}.s-compacto .lst{width:360px}
.s-minimo .row{background:none;border:0}.s-minimo .row .ttl,.s-minimo .row .sub,.s-minimo .hd{text-shadow:0 2px 10px rgba(0,0,0,.85)}
.h-capa .cov{display:none}.h-artista .sub{display:none}.h-pedido .chip{display:none}.h-barra .track,.h-barra .bw .tm2{display:none}
.h-tempo .tm,.h-tempo .tm2{display:none}.h-posicao .n{display:none}.h-eq .eq{display:none}.h-titulo .hd{display:none}
#dbg{position:fixed;right:6px;bottom:4px;font:11px monospace;color:#888}
</style>
</head>
<body>
<div id="stage"><div id="box"></div></div>
<div id="dbg"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), P=new URLSearchParams(location.search);
const seg=location.pathname.split('/').filter(Boolean), TOKEN=seg[1]||P.get('t')||'';
const VIEW=({fila:'fila',historico:'hist',hist:'hist'})[seg[2]||P.get('view')]||'agora';
const num=(k,d,lo,hi)=>{const v=parseFloat(P.get(k));return isFinite(v)?Math.min(hi,Math.max(lo,v)):d};
const hex=(k,d)=>/^[0-9a-f]{3,8}$/i.test(P.get(k)||'')?'#'+P.get(k):d;
const R=document.documentElement.style, VEL=num('vel',1,.3,3), ESC=num('escala',1,.3,3), AUTO=num('auto',0,0,3600);
R.setProperty('--c1',hex('cor','#fe2c55'));R.setProperty('--c2',hex('destaque','#25f4ee'));
R.setProperty('--v',VEL);R.setProperty('--glass',num('vidro',58,0,100)/100);
const stage=$('#stage'),box=$('#box');
stage.className=['se','sd','ie','id','c'].includes(P.get('canto'))?P.get('canto'):(VIEW==='agora'?'ie':'sd');
document.body.classList.add('s-'+(['compacto','minimo'].includes(P.get('estilo'))?P.get('estilo'):'cartao'));
if(P.get('fundo')==='1')document.body.classList.add('prev');
(P.get('ocultar')||'').split(',').forEach(x=>x&&document.body.classList.add('h-'+x.trim()));
const MAX=num('max',5,1,12);
const D=ms=>ms/VEL, EASE='cubic-bezier(.2,.8,.2,1)';
const esc=s=>String(s??'');
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hora=t=>t?new Date(t*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const porTxt=p=>p==='autoplay'?'Autoplay':p==='painel'?'Streamer':p;
const mk=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
function capa(img,id){ // maxres quando existir, senão mqdefault
  const base='https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/';img.referrerPolicy='no-referrer';img.decoding='async';
  img.onerror=()=>{img.onerror=null;img.src=base+'mqdefault.jpg'};
  img.onload=()=>{if(img.naturalWidth&&img.naturalWidth<200&&img.src.includes('maxres')){img.onload=null;img.src=base+'mqdefault.jpg'}};
  img.src=base+'maxresdefault.jpg';
}
function marquee(el){ // título longo rola só se não couber
  const s=el.firstElementChild;el.classList.remove('mq');s.style.transform='';
  const d=s.scrollWidth-el.clientWidth;if(d>4){el.style.setProperty('--d',d);el.style.setProperty('--t',Math.max(4,d/28));el.classList.add('mq')}
}
function fit(){ // nunca passa da área visível
  box.style.transform='none';const w=box.offsetWidth,h=box.offsetHeight;if(!w)return;
  const cs=getComputedStyle(stage),m=parseFloat(cs.paddingLeft)*2;
  const k=Math.min(ESC,(innerWidth-m)/w,(innerHeight-m)/h);box.style.transform='scale('+k+')';
}
addEventListener('resize',fit);
let visivel=false,hideT=0;
function mostrar(on){
  if(on===visivel)return;visivel=on;
  box.animate(on?[{opacity:0,transform:box.style.transform+' translateY(16px) scale(.96)'},{opacity:1,transform:box.style.transform}]
    :[{opacity:1},{opacity:0,transform:box.style.transform+' translateY(10px)'}],{duration:D(on?520:360),easing:EASE,fill:'forwards'});
}
/* ---------- AGORA TOCANDO ---------- */
let npEl,anims=[],lastKey=null,dur=0,t0=0,pos0=0,rodando=false;
function buildNP(){
  box.innerHTML='<div class="glass np" id="np"><div class="glow"></div><div class="cov"><img alt=""></div><div class="info"><div class="r1"><div class="ttl"><span></span></div><div class="eq"><i></i><i></i><i></i><i></i></div></div><div class="sub"></div><div class="bw"><span class="tm" id="tc">0:00</span><div class="track"><div class="clip"><div class="fill"></div></div><div class="head"></div></div><span class="tm tm2" id="td">0:00</span></div><div class="chip"><i></i><b></b></div></div></div>';
  npEl=$('#np');
}
function renderNP(d){
  const a=d.atual&&d.tocando?d.atual:null;
  if(!a){if(visivel){mostrar(false)}lastKey=null;return}
  if(!npEl)buildNP();
  const key=d.seq+':'+a.id, nova=key!==lastKey;
  const apply=()=>{
    $('.ttl span',npEl).textContent=esc(a.titulo);$('.sub',npEl).textContent=esc(a.artista);
    $('.chip b',npEl).textContent=porTxt(esc(d.atual.por));capa($('.cov img',npEl),a.id);
    const g=$('.glow',npEl);g.style.backgroundImage='url(https://i.ytimg.com/vi/'+encodeURIComponent(a.id)+'/mqdefault.jpg)';
    npEl.classList.remove('x');fit();marquee($('.ttl',npEl));
  };
  dur=d.dur||a.duracao||0;
  if(nova){
    lastKey=key;
    const first=!visivel;
    if(first){apply();fit()}else{
      const parts=[$('.cov',npEl),$('.info',npEl)];
      parts.forEach(p=>p.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-10px)'}],{duration:D(220),easing:'ease-in',fill:'forwards'}));
      setTimeout(()=>{apply();parts.forEach((p,i)=>p.animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:D(420),delay:D(i*70),easing:EASE,fill:'both'}))},D(230));
    }
    anims.forEach(x=>x.cancel());
    anims=[$('.fill',npEl),$('.head',npEl)].map(e=>e.animate([{transform:'translateX(-100%)'},{transform:'translateX(0)'}],{duration:Math.max(1,dur*1000),easing:'linear',fill:'both'}));
    anims.forEach(x=>x.pause());
    if(first)mostrar(true);
    if(AUTO){clearTimeout(hideT);hideT=setTimeout(()=>mostrar(false),AUTO*1000)}
    $('#td',npEl).textContent=dur?fmt(dur):'--:--';
  }
  npEl.classList.toggle('paused',!!d.pausado);
  // sincroniza barra (só corrige se desviar >1,2s)
  const alvo=Math.min(d.pos||0,dur||1e9)*1000;
  anims.forEach(x=>{if(Math.abs((x.currentTime||0)-alvo)>1200||nova)x.currentTime=alvo;d.pausado?x.pause():x.play()});
  rodando=!d.pausado;
}
setInterval(()=>{if(VIEW!=='agora'||!anims[0]||!npEl)return;$('#tc',npEl).textContent=fmt((anims[0].currentTime||0)/1000)},500);
/* ---------- LISTAS (fila / histórico) ---------- */
const els=new Map();let rows,more,cnt;
function buildList(titulo){
  box.innerHTML='<div class="glass lst" id="ls"><div class="hd"><span>'+titulo+'</span><small></small></div><div class="rows"></div><div class="more"></div></div>';
  rows=$('.rows');more=$('.more');cnt=$('.hd small');
}
function rowHTML(x,hist){return '<div class="row"><span class="n"></span><div class="cov"><img alt=""></div><div class="tx"><div class="ttl"><span></span></div><div class="sub"></div></div>'+(hist?'<span class="tm"></span>':'<span class="chip"><i></i><b></b></span>')+'</div>'}
function renderList(d){
  const hist=VIEW==='hist', src=hist?d.historico:d.fila, total=hist?src.length:(d.fila_total||src.length);
  if(!rows)buildList(hist?'Tocadas recentemente':'A seguir');
  const items=src.slice(0,MAX), keys=new Set(items.map(x=>x.id+(hist?':'+x.quando:'')));
  const first=new Map();els.forEach((e,k)=>first.set(k,e.getBoundingClientRect().top));
  els.forEach((e,k)=>{if(keys.has(k))return;els.delete(k);
    e.style.cssText+=';position:absolute;left:0;right:0;top:'+e.offsetTop+'px;pointer-events:none';
    e.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX(-28px)'}],{duration:D(320),easing:'ease-in',fill:'forwards'}).onfinish=()=>e.remove()});
  items.forEach((x,i)=>{
    const k=x.id+(hist?':'+x.quando:'');let e=els.get(k),novo=!e;
    if(novo){e=mk(rowHTML(x,hist));els.set(k,e);$('.ttl span',e).textContent=esc(x.titulo);$('.sub',e).textContent=esc(x.artista);capa($('img',e),x.id);
      if(hist)$('.tm',e).textContent=hora(x.quando);else $('.chip b',e).textContent=porTxt(esc(x.por))}
    $('.n',e).textContent=i+1;e.classList.toggle('next',!hist&&i===0);rows.appendChild(e);e._novo=novo;e._i=i;
  });
  items.forEach(x=>{const k=x.id+(hist?':'+x.quando:''),e=els.get(k);
    if(e._novo){e.animate([{opacity:0,transform:'translateX(34px) scale(.97)'},{opacity:1,transform:'none'}],{duration:D(480),delay:D(e._i*60),easing:EASE,fill:'backwards'});e._novo=false}
    else if(first.has(k)){const dy=first.get(k)-e.getBoundingClientRect().top;if(Math.abs(dy)>1)e.animate([{transform:'translateY('+dy+'px)'},{transform:'none'}],{duration:D(420),easing:EASE})}
    marquee($('.ttl',e));});
  cnt.textContent=hist?'':total+(total===1?' música':' músicas');
  more.textContent=!hist&&total>MAX?'+'+(total-MAX)+' na fila':'';more.style.display=more.textContent?'':'none';
  fit();mostrar(items.length>0);
}
/* ---------- conexão ---------- */
let falhas=0,ultimo='';
async function tick(){
  let prox=VIEW==='agora'?1500:2500;
  try{
    const r=await fetch('/api/overlay/'+encodeURIComponent(TOKEN),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();falhas=0;$('#dbg').textContent=P.get('debug')?'ok':'';
    if(VIEW==='agora')renderNP(d);else{const sig=JSON.stringify([d.fila,d.fila_total,d.historico]);if(sig!==ultimo){ultimo=sig;renderList(d)}}
  }catch(e){falhas++;prox=Math.min(10000,1500*2**Math.min(falhas,3));$('#dbg').textContent=P.get('debug')?'reconectando… ('+falhas+')':''}
  setTimeout(tick,document.hidden?5000:prox);
}
tick();
</script>
</body>
</html>
